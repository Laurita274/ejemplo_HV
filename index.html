<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura Castañeda | Desarrolladora de Software</title>
    <!-- Importamos la librería zero-md para leer Markdown y FontAwesome para iconos -->
    <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Variables de colores (Tema Claro por defecto) */
        :root {
            --bg-color: #f0f4f8;
            --container-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --primary: #4f46e5; /* Indigo */
            --primary-hover: #4338ca;
            --accent: #0ea5e9; /* Light blue */
            --shadow: rgba(0, 0, 0, 0.1);
            --border: #e2e8f0;
        }

        /* Variables Tema Oscuro */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --accent: #38bdf8;
            --shadow: rgba(0, 0, 0, 0.4);
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Menú Lateral Flotante */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 80px;
            background-color: var(--container-bg);
            box-shadow: 4px 0 15px var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 0;
            z-index: 100;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 15px;
            border-radius: 50%;
            transition: all 0.3s ease;
            margin-top: auto;
        }

        .theme-toggle:hover {
            color: var(--primary);
            background-color: rgba(79, 70, 229, 0.1);
            transform: scale(1.1);
        }

        /* Contenedor Principal */
        .main-content {
            margin-left: 80px; /* Deja espacio para el menú lateral */
            padding: 40px 20px;
            width: calc(100% - 80px);
            display: flex;
            justify-content: center;
        }

        .cv-container {
            background: var(--container-bg);
            max-width: 950px;
            width: 100%;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 10px 30px var(--shadow);
            border-top: 5px solid var(--primary);
            animation: fadeIn 0.8s ease-out;
        }

        /* Animación de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Personalización interna del Markdown renderizado por zero-md */
        zero-md {
            /* Forzamos a que el texto herede los colores de nuestro tema */
            color: var(--text-main);
        }

        /* Media Queries para móviles */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                position: relative;
                width: 100%;
                height: 60px;
                flex-direction: row;
                justify-content: flex-end;
                padding: 0 20px;
                box-shadow: 0 4px 15px var(--shadow);
            }
            .theme-toggle {
                margin-top: 0;
            }
            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 20px 10px;
            }
            .cv-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Menú Lateral -->
    <nav class="sidebar">
        <!-- Puedes añadir más botones aquí si lo deseas -->
        <button class="theme-toggle" id="themeBtn" title="Cambiar Tema">
            <i class="fas fa-moon"></i>
        </button>
    </nav>

    <!-- Contenido Principal -->
    <main class="main-content">
        <div class="cv-container">
            <!-- Renderizador de Markdown. Usamos un template interno para inyectar CSS directo al Shadow DOM -->
            <zero-md src="cv.md">
                <template>
                    <!-- Estilos inyectados DENTRO del zero-md para que afecten al markdown renderizado -->
                    <style>
                        :host {
                            font-family: 'Poppins', sans-serif;
                        }
                        h1 { 
                            color: var(--primary); 
                            text-align: center; 
                            font-size: 2.5em; 
                            margin-bottom: 0.2em;
                        }
                        h2, h3 { 
                            color: var(--accent); 
                            border-bottom: 2px solid var(--border); 
                            padding-bottom: 5px; 
                            margin-top: 1.5em;
                        }
                        a { 
                            color: var(--primary); 
                            text-decoration: none; 
                            font-weight: 600;
                            transition: color 0.3s ease;
                        }
                        a:hover { 
                            color: var(--primary-hover); 
                            text-decoration: underline; 
                        }
                        hr {
                            border: none;
                            height: 1px;
                            background: var(--border);
                            margin: 20px 0;
                        }
                        p, li {
                            line-height: 1.6;
                            color: var(--text-main);
                        }
                        strong {
                            color: var(--primary);
                        }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                            margin-top: 15px;
                        }
                        th, td {
                            padding: 12px;
                            border: 1px solid var(--border);
                            text-align: left;
                        }
                        th {
                            background-color: rgba(79, 70, 229, 0.05);
                            color: var(--primary);
                        }
                        /* Efecto hover en imágenes (las insignias de los lenguajes) */
                        img {
                            transition: transform 0.2s ease;
                            margin: 2px;
                        }
                        img:hover {
                            transform: scale(1.1);
                        }
                    </style>
                </template>
            </zero-md>
        </div>
    </main>

    <!-- Lógica de JavaScript para el Modo Oscuro -->
    <script>
        const themeBtn = document.getElementById('themeBtn');
        const icon = themeBtn.querySelector('i');

        // Revisar si el usuario ya tenía preferencia guardada
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            icon.classList.replace('fa-moon', 'fa-sun');
        }

        themeBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                icon.classList.replace('fa-sun', 'fa-moon');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                icon.classList.replace('fa-moon', 'fa-sun');
            }
        });
    </script>
</body>
</html>
