<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura Castañeda | Desarrolladora de Software</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #e2e8f0;
            --container-bg: #ffffff;
            --sidebar-bg: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --primary: #4f46e5; 
            --accent: #0ea5e9; 
            --highlight-bg: rgba(79, 70, 229, 0.1);
            --shadow: rgba(0, 0, 0, 0.08);
            --border: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --sidebar-bg: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #818cf8;
            --accent: #38bdf8;
            --highlight-bg: rgba(129, 140, 248, 0.15);
            --shadow: rgba(0, 0, 0, 0.3);
            --border: #334155;
        }

        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* Contenedor Horizontal (Dos columnas) */
        .resume-wrapper {
            display: flex;
            flex-direction: row;
            background: var(--container-bg);
            max-width: 1200px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 15px 35px var(--shadow);
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Columna Izquierda: Perfil */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            padding: 50px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border);
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: 0 8px 20px var(--shadow);
            margin-bottom: 25px;
        }

        .sidebar h1 {
            color: var(--text-main);
            font-size: 1.6rem;
            margin: 0 0 5px 0;
            text-align: center;
        }

        .sidebar h2 {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 400;
            margin: 0 0 30px 0;
            text-align: center;
        }

        .contact-links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-links a, .contact-links span {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .contact-links a:hover { color: var(--primary); }
        .contact-links i { color: var(--primary); width: 20px; text-align: center; font-size: 1.2rem; }

        .theme-toggle {
            margin-top: 40px;
            background: var(--border);
            border: none;
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-toggle:hover { background: var(--primary); color: white; }

        /* Columna Derecha: Contenido Markdown */
        .main-content {
            flex: 1;
            padding: 50px 60px;
            overflow-y: auto;
        }

        /* Responsivo (Móviles) */
        @media (max-width: 900px) {
            .resume-wrapper { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
            .main-content { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="resume-wrapper">
        <!-- Columna Izquierda -->
        <aside class="sidebar">
            <!-- Asegúrate de tener tu foto en la carpeta assets -->
            <img src="assets/perfil.jpg" alt="Laura Castañeda" class="profile-img">
            <h1>Laura Castañeda</h1>
            <h2>Desarrolladora de Software</h2>
            
            <div class="contact-links">
                <span><i class="fas fa-map-marker-alt"></i> Medellín, Colombia</span>
