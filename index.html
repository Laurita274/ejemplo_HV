<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura Castañeda | Desarrolladora de Software</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #e2e8f0;
            --container-bg: #ffffff;
            --sidebar-bg: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --primary: #4f46e5; 
            --accent: #0ea5e9; 
            --highlight-bg: rgba(79, 70, 229, 0.1);
            --shadow: rgba(0, 0, 0, 0.08);
            --border: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --sidebar-bg: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #818cf8;
            --accent: #38bdf8;
            --highlight-bg: rgba(129, 140, 248, 0.15);
            --shadow: rgba(0, 0, 0, 0.3);
            --border: #334155;
        }

        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* Contenedor Horizontal */
        .resume-wrapper {
            display: flex;
            flex-direction: row;
            background: var(--container-bg);
            max-width: 1200px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 15px 35px var(--shadow);
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Columna Izquierda: Perfil */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            padding: 50px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border);
        }

        /* Avatar Tipográfico (Sustituto de la foto) */
        .profile-placeholder {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 700;
            box-shadow: 0 8px 20px var(--shadow);
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .sidebar h1 {
            color: var(--text-main);
            font-size: 1.6rem;
            margin: 0 0 5px 0;
            text-align: center;
        }

        .sidebar h2 {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 400;
            margin: 0 0 30px 0;
            text-align: center;
        }

        .contact-links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-links a, .contact-links span {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .contact-links a:hover { color: var(--primary); }
        .contact-links i { color: var(--primary); width: 20px; text-align: center; font-size: 1.2rem; }

        .theme-toggle {
            margin-top: 40px;
            background: var(--border);
            border: none;
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-toggle:hover { background: var(--primary); color: white; }

        /* Columna Derecha: Contenido Markdown */
        .main-content {
            flex: 1;
            padding: 50px 60px;
            overflow-y: auto;
        }

        /* Responsivo (Móviles) */
        @media (max-width: 900px) {
            .resume-wrapper { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
            .main-content { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="resume-wrapper">
        <!-- Columna Izquierda -->
        <aside class="sidebar">
            <!-- Avatar tipográfico sin necesidad de imagen -->
            <div class="profile-placeholder">LC</div>
            
            <h1>Laura Castañeda</h1>
            <h2>Desarrolladora de Software</h2>
            
            <div class="contact-links">
                <span><i class="fas fa-map-marker-alt"></i> Medellín, Colombia</span>
                <a href="mailto:tu-correo@gmail.com"><i class="fas fa-envelope"></i> tu-correo@gmail.com</a>
                <a href="https://linkedin.com/in/tu-perfil" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="https://github.com/Laurita274" target="_blank"><i class="fab fa-github"></i> GitHub</a>
            </div>

            <button class="theme-toggle" id="themeBtn">
                <i class="fas fa-moon"></i> Modo Oscuro
            </button>
        </aside>

        <!-- Columna Derecha -->
        <main class="main-content">
            <zero-md src="cv.md">
                <template>
                    <style>
                        :host { font-family: 'Poppins', sans-serif; color: var(--text-main); }
                        h2, h3 { color: var(--accent); border-bottom: 2px solid var(--border); padding-bottom: 5px; margin-top: 1.5em; }
                        h2:first-child { margin-top: 0; }
                        a { color: var(--primary); text-decoration: none; font-weight: 600; }
                        a:hover { text-decoration: underline; }
                        p, li { line-height: 1.7; color: var(--text-muted); }
                        
                        /* Resaltado de Palabras Clave (Etiquetas) que reemplazan a las insignias */
                        strong {
                            color: var(--primary);
                            background-color: var(--highlight-bg);
                            padding: 4px 10px;
                            border-radius: 6px;
                            font-weight: 600;
                            display: inline-block;
                            margin: 3px 2px;
                            border: 1px solid rgba(79, 70, 229, 0.2);
                        }

                        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); color: var(--text-muted); vertical-align: top;}
                        th { color: var(--primary); font-weight: 600; width: 25%; }
                    </style>
                </template>
            </zero-md>
        </main>
    </div>

    <script>
        const themeBtn = document.getElementById('themeBtn');
        const icon = themeBtn.querySelector('i');
        const currentTheme = localStorage.getItem('theme') || 'light';

        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            icon.classList.replace('fa-moon', 'fa-sun');
            themeBtn.innerHTML = '<i class="fas fa-sun"></i> Modo Claro';
        }

        themeBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeBtn.innerHTML = '<i class="fas fa-moon"></i> Modo Oscuro';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeBtn.innerHTML = '<i class="fas fa-sun"></i> Modo Claro';
            }
        });
    </script>
</body>
</html>
